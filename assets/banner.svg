<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2018"/>
      <stop offset="55%" stop-color="#113524"/>
      <stop offset="100%" stop-color="#0D2B1F"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#3FB27F" fill-opacity="0.18"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <!-- concentric signal arcs, top right -->
    <g stroke="#3FB27F" fill="none" stroke-linecap="round">
      <circle cx="1150" cy="150" r="120" stroke-opacity="0.35" stroke-width="2"/>
      <circle cx="1150" cy="150" r="185" stroke-opacity="0.22" stroke-width="2"/>
      <circle cx="1150" cy="150" r="250" stroke-opacity="0.12" stroke-width="2"/>
      <circle cx="1150" cy="150" r="6" fill="#3FB27F" stroke="none"/>
    </g>

    <!-- step response sketch, lower right -->
    <g stroke-linecap="round" fill="none">
      <path d="M 860 268 H 1090" stroke="#3FB27F" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="5 6"/>
      <path d="M 860 300
               C 876 300, 886 238, 910 224
               C 928 214, 940 282, 958 280
               C 973 278, 978 260, 994 262
               C 1008 263, 1012 272, 1026 270
               C 1042 268, 1050 268, 1090 268"
            stroke="#3FB27F" stroke-opacity="0.45" stroke-width="2.5"/>
    </g>

    <!-- accent rule -->
    <rect x="80" y="86" width="64" height="4" rx="2" fill="#3FB27F"/>

    <text x="80" y="168" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Raul Pop</text>

    <text x="80" y="208" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#3FB27F">Automation &amp; Applied Informatics</text>

    <text x="80" y="241" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#8FBFA9">Technical University of Cluj&#8209;Napoca &#183; Faculty of Automation and Computer Science</text>

    <text x="80" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#5E9078" letter-spacing="0.5">C#  &#183;  C++  &#183;  Java  &#183;  MATLAB  &#183;  MySQL  &#183;  Redis  &#183;  Docker</text>

    <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="16" stroke="#2A7D5A" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
</svg>
